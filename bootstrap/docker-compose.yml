version: '3.8'

services:
# docker exec bootstrap-postgres-1 pg_dump -U semaphore -d semaphore > semaphore_backup_$(date +%Y%m%d).sql
# bootstrap-postgres-1 is the containername, please  check with "docker ps" command and adjust if necessary
# restore: cat backup.sql | docker exec -i bootstrap-postgres-1 psql -U semaphore -d semaphore
  postgres:
    image: postgres:14-alpine
    volumes:
      - semaphore-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: tbd
      POSTGRES_DB: semaphore
    restart: unless-stopped

  semaphore:
    image: public.ecr.aws/semaphore/pro/server:v2.16.51
    ports:
      - 3000:3000
    environment:
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: tbd
      SEMAPHORE_DB_HOST: postgres
      SEMAPHORE_DB_PORT: 5432
      SEMAPHORE_DB: semaphore
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: tbd
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      # Crucial: This key encrypts your SSH keys in the DB
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: "tbd" 

    depends_on:
      - postgres
    volumes:
      - ./requirements.txt:/etc/semaphore/requirements.txt
    restart: unless-stopped

volumes:
  semaphore-postgres:

# Generate a secure encryption key for SEMAPHORE_ACCESS_KEY_ENCRYPTION on your Mac terminal using: 
# head -c32 /dev/urandom | base64

# configure semaphore via UI:
# - Open http://localhost:3000 in your browser.
# - Log in with username: admin and password
# - Follow the prompts to set up your first project and connect it to your Git repository.
# Generate an SSH Key: On your Mac, run ssh-keygen -t ed25519 -C "your_email@example.com" 
# Press Enter to accept the default file location
# leave passphrase empty → fully automatic login
# This creates:
# id_ed25519 private key keep secret
# id_ed25519.pub public key copy to Pi: ssh-copy-id username@192.168.100.152 
# enter one last time your pw
# connect passwordless with username@192.168.100.152
