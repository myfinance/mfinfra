# 1. Get current hosts to find orphans (using the specific XML API module)
- name: Fetch existing IPHosts
  vars:
    ansible_connection: httpapi
    ansible_network_os: sophos.sophos_firewall.sfos
  sophos.sophos_firewall.sfos_xmlapi:
    xml_tag: "IPHost"
    state: "query"
  register: current_hosts_raw

- name: Identify Orphaned Prefixed Hosts
  set_fact:
    hosts_to_delete: >-
      {{
        current_hosts_raw.response.IPHost | default([])
        | map(attribute='Name') 
        | select('match', '^' ~ managed_prefix) 
        | difference(managed_ip_hosts | map(attribute='name') | list)
      }}

# 2. Delete orphans using the dedicated host module
- name: Remove Orphaned IPHosts
  vars:
    ansible_connection: httpapi
    ansible_network_os: sophos.sophos_firewall.sfos
  sophos.sophos_firewall.sfos_ip_host:
    name: "{{ item }}"
    state: absent
  loop: "{{ hosts_to_delete }}"

# 3. Create/Update managed hosts using the dedicated host module
- name: Sync Managed IPHosts
  vars:
    ansible_connection: httpapi
    ansible_network_os: sophos.sophos_firewall.sfos
  sophos.sophos_firewall.sfos_ip_host:
    name: "{{ item.name }}"
    address_type: "{{ 'IP' if item.type == 'IP' else 'IPRange' }}"
    ip_address: "{{ item.ip | default(omit) }}"
    start_ip: "{{ item.start | default(omit) }}"
    end_ip: "{{ item.end | default(omit) }}"
    state: present
  loop: "{{ managed_ip_hosts }}"
